services:
  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    networks:
      - budget_network

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    networks:
      - budget_network
      
  service:
    build:
      context: .
      dockerfile: Dockerfile.service
    environment:
      - MONGO_URL=mongodb://mongo:27017/budget
      - REDIS_URL=redis://redis:6379
      - SECRET=replace_this_secret
      - ADMIN_PASSWORD=admin
    ports:
      - "3000:3000"
    depends_on:
      - mongo
      - redis
    networks:
      - budget_network

  client:
    build:
      context: .
      dockerfile: Dockerfile.client
    environment:
      - NODE_ENV=production
      - SERVICE_URL=http://service:3000
    ports:
      - "8080:3000"
    depends_on:
      - service
    networks:
      - budget_network

networks:
  budget_network:
    driver: bridge
